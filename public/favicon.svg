<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- App Background (Android Squircle / Round Rect) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Document Fold Effect -->
  <g filter="url(#shadow)">
    <!-- Main Sheet -->
    <path d="M140 100 H300 L372 172 V412 H140 Z" fill="url(#paperGrad)" rx="16"/>
    <!-- Fold Corner -->
    <path d="M300 100 V172 H372 Z" fill="#cbd5e1"/>
    
    <!-- Accent Stripes & PDF Stamp -->
    <rect x="180" y="210" width="152" height="14" rx="7" fill="#dc2626"/>
    <rect x="180" y="240" width="110" height="12" rx="6" fill="#94a3b8"/>
    <rect x="180" y="266" width="135" height="12" rx="6" fill="#94a3b8"/>
    <rect x="180" y="292" width="90" height="12" rx="6" fill="#94a3b8"/>

    <!-- Red PDF Pill Badge -->
    <rect x="170" y="325" width="172" height="54" rx="14" fill="#dc2626"/>
    <text x="256" y="362" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" text-anchor="middle" letter-spacing="3">PDF</text>
  </g>

  <!-- Android Sparkle / Fast Convert Icon in top corner -->
  <circle cx="390" cy="115" r="32" fill="#fbbf24" filter="url(#shadow)"/>
  <path d="M390 95 L395 110 L410 115 L395 120 L390 135 L385 120 L370 115 L385 110 Z" fill="#78350f"/>
</svg>
